# Builds the Free Muse apps and publishes them as a GitHub release when a version tag (v*) is pushed.
#  - Desktop: macOS (universal .dmg/.zip), Windows (installer + portable .exe), Linux (.AppImage, .deb, .tar.gz)
#  - Android: installable .apk (signed with the build's own key)
#  - iOS: unsigned .ipa (sideload with AltStore/Sideloadly, or re-sign with your Apple account)
# The release is only created when every build succeeded.
# Ways to release: push a tag "vX.Y.Z", or push a commit whose message contains "[release]" (the version then comes
# from apps/desktop/package.json and the release job creates the tag), or run the workflow manually.
name: Release

on:
  push:
    tags: ['v*']
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  version:
    name: Decide version
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then V="${GITHUB_REF_NAME#v}"; else V=$(node -p "require('./apps/desktop/package.json').version"); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing v$V"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, target: --mac }
          - { name: Windows, os: windows-latest, target: --win }
          - { name: Linux, os: ubuntu-latest, target: --linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Set version
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${{ needs.version.outputs.version }}"
      - run: npm ci
      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.tar.gz

  android:
    name: Android (APK)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: '1'
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        env:
          NODE_ENV: production
      - name: Collect
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "out/FreeMuse-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: out/*.apk

  ios:
    name: iOS (unsigned IPA)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate native iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install --clean
        env:
          CI: '1'
      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build (no code signing)
        working-directory: apps/mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/FreeMuse.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive | tail -n 40
      - name: Package IPA
        working-directory: apps/mobile/ios
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p Payload "$GITHUB_WORKSPACE/out"
          cp -R build/FreeMuse.xcarchive/Products/Applications/*.app Payload/
          zip -qry "$GITHUB_WORKSPACE/out/FreeMuse-${VERSION}-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          if-no-files-found: error
          path: out/*.ipa

  release:
    name: Publish release
    needs: [version, desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            # Creates the tag at this commit if it doesn't exist yet.
            gh release create "$TAG" artifacts/* --title "Free Muse $TAG" --notes-file .github/release-notes.md --target "$GITHUB_SHA" --latest
          fi
